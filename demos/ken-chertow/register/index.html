<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#071426">
<title>Register with Coach Ken — Gold Medal Training Camps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#071426; --navy-2:#0c1f3a; --gold:#ECB838; --gold-d:#C88C1E;
    --ink:#1b2330; --muted:#6c7480; --line:#e6e9ef; --bg:#eef1f6; --card:#fff;
    --good:#1f9d5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);line-height:1.5}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

  /* header */
  header{background:var(--navy);color:#fff;padding:16px 18px 18px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(236,184,56,.16),transparent 70%)}
  .brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
  .star{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .star svg{width:23px;height:23px}
  .brand h1{margin:0;font-family:'Playfair Display',serif;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .brand p{margin:1px 0 0;font-size:11px;color:#9fb0c6;font-weight:500;letter-spacing:.02em}

  /* coach speech */
  .coach{display:flex;gap:10px;padding:16px 18px 4px;align-items:flex-start}
  .coach .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(150deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:13px;box-shadow:0 2px 6px rgba(7,20,38,.18)}
  .coach .say{background:#fff;border:1px solid var(--line);border-radius:5px 16px 16px 16px;padding:11px 14px;font-size:14.5px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .coach .say b{color:var(--navy-2)}

  /* progress */
  .prog{display:flex;gap:6px;padding:14px 20px 6px}
  .prog i{height:4px;border-radius:3px;flex:1;background:#dfe3ea;transition:.3s}
  .prog i.on{background:var(--gold)}

  /* step area */
  main{flex:1;padding:6px 18px 24px}
  .step-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);margin:10px 2px 12px}
  .cards{display:flex;flex-direction:column;gap:11px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:inherit;color:inherit;position:relative}
  .card:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 6px 18px rgba(7,20,38,.08)}
  .card.sel{border-color:var(--gold);background:#fffdf5;box-shadow:0 0 0 3px rgba(236,184,56,.18)}
  .card .ic{width:42px;height:42px;border-radius:11px;background:#f4f1e6;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .card .body{flex:1;min-width:0}
  .card .t{font-weight:700;font-size:15.5px;color:var(--navy-2)}
  .card .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card .price{text-align:right;flex-shrink:0}
  .card .price .big{font-weight:800;font-size:19px;color:var(--navy)}
  .card .price .lab{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .card .price .sub{font-size:10px;color:var(--gold-d);font-weight:600;margin-top:1px}
  .tag{position:absolute;top:-9px;right:14px;background:var(--navy);color:var(--gold);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
  .nudge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#b54708;background:#fff5e8;border:1px solid #fde2bf;padding:3px 9px;border-radius:20px;font-weight:600;margin-top:9px}
  .card.dim{opacity:.5;pointer-events:none}

  /* summary */
  .receipt{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
  .receipt .top{background:var(--navy);color:#fff;padding:16px 18px}
  .receipt .top .nm{font-family:'Playfair Display',serif;font-size:20px;font-weight:800}
  .receipt .top .dt{font-size:12.5px;color:#9fb0c6;margin-top:2px}
  .rrow{display:flex;justify-content:space-between;padding:11px 18px;font-size:14px;border-bottom:1px solid var(--line)}
  .rrow .k{color:var(--muted)}
  .rrow .v{font-weight:600;color:var(--navy-2);text-align:right}
  .rtot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;background:#fffdf5}
  .rtot .k{font-weight:700;color:var(--navy-2)}
  .rtot .v{font-weight:800;font-size:24px;color:var(--navy)}
  .rtot .v small{font-size:11px;color:var(--muted);font-weight:600;display:block;text-align:right}
  .fineprint{font-size:12px;color:var(--muted);padding:12px 4px 0;line-height:1.5}
  .ohio{margin-top:14px;background:#fff;border:1px dashed #cfd6e2;border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--navy-2)}
  .ohio b{color:var(--gold-d)}

  /* buttons */
  .cta{display:block;width:100%;margin-top:16px;background:var(--navy);color:var(--gold);border:0;border-radius:13px;padding:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(7,20,38,.22);transition:.16s}
  .cta:hover{background:var(--navy-2);transform:translateY(-1px)}
  .cta .arr{transition:.16s;display:inline-block}
  .cta:hover .arr{transform:translateX(3px)}
  .cta-sub{text-align:center;font-size:11.5px;color:var(--muted);margin-top:9px}
  .back{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 2px;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
  .back:hover{color:var(--navy-2)}

  footer{text-align:center;font-size:11px;color:var(--muted);padding:10px 18px 18px}
  footer a{color:var(--gold-d);text-decoration:none;font-weight:600}

  /* Ask Coach launcher + overlay */
  #askBtn{position:fixed;bottom:18px;right:18px;z-index:40;background:var(--gold);color:var(--navy);border:0;border-radius:26px;padding:12px 17px 12px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(7,20,38,.28);display:flex;align-items:center;gap:8px}
  #askBtn:hover{background:#f3c542}
  #askBtn svg{width:19px;height:19px}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(7,20,38,.55);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;height:88dvh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
  .sheet .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--navy);color:#fff;flex-shrink:0}
  .sheet .bar span{font-weight:700;font-size:14px}
  .sheet .bar button{background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
  .sheet iframe{flex:1;border:0;width:100%}
  @media(min-width:560px){.ov{align-items:center}.sheet{border-radius:18px;height:80dvh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="star"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.4 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z" fill="#071426"/></svg></div>
      <div><h1>Register with Coach Ken</h1><p>GOLD MEDAL TRAINING CAMPS · 2026</p></div>
    </div>
  </header>

  <div class="coach">
    <div class="av">K</div>
    <div class="say" id="say">Let's get your wrestler signed up — I'll walk you through it. Takes about a minute.</div>
  </div>

  <div class="prog" id="prog"><i></i><i></i><i></i><i></i></div>

  <main id="main"></main>

  <footer>Real 2026 camp options · secure checkout by RegFox · questions? <a href="mailto:camps@kenchertow.com">camps@kenchertow.com</a></footer>
</div>

<button id="askBtn" aria-label="Ask Coach a question">
  <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 18 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v9a2.5 2.5 0 0 1-2.5 2.5H7.5Z" stroke="#071426" stroke-width="2" stroke-linejoin="round"/></svg>
  Ask Coach
</button>
<div class="ov" id="ov">
  <div class="sheet">
    <div class="bar"><span>💬 Coach Ken's Camp Assistant</span><button id="ovClose" aria-label="Close">×</button></div>
    <iframe id="ovFrame" title="Ask Coach" loading="lazy"></iframe>
  </div>
</div>

<script>
/* ---------- EXACT 2026 catalog (verified from the live RegFox forms) ---------- */
const FORMS = {
  boys:  'https://register.kenchertow.com/gold-medal-training-camps-for-boys-2026',
  girls: 'https://register.kenchertow.com/gold-medal-training-camps-for-girls-2026',
  youth: 'https://register.kenchertow.com/gold-medal-training-camps-for-youth-2026',
};
const WHO = [
  {id:'boys',  ic:'🤼', t:'Teen Boys',  d:'Middle & high school'},
  {id:'girls', ic:'🤼‍♀️', t:'Teen Girls', d:'Middle & high school'},
  {id:'youth', ic:'🧒', t:'Youth (6–13)', d:'Future Champions, Kids & SuperKid'},
];
const TEEN = [
  {id:'tech4',  name:'Gold Medal Technique Camp', dur:'4-Day', dates:'4 days', comm:625, res:700, nights:3, blurb:'Sharpen technique — a great first camp.'},
  {id:'train6', name:'Gold Medal Training Camp',  dur:'6-Day', dates:'6 days', comm:850, res:950, nights:5, blurb:'The classic — technique plus live wrestling.'},
  {id:'train11',name:'Gold Medal Training Camp',  dur:'11-Day',dates:'Jun 28 – Jul 8', comm:1750, res:1950, nights:10, blurb:'Go deeper. Eleven days on the mat.'},
  {id:'super13',name:'Super Gold Medal Training Camp', dur:'13-Day', dates:'Jun 28 – Jul 10', comm:1900, res:2150, nights:12, tag:'Most serious', blurb:'The full grind — our most intensive camp.'},
];
const CATALOG = {
  boys: TEEN, girls: TEEN,
  youth: [
    {id:'fc4',      name:'Future Champions Parent/Child', dur:'4-Day', dates:'Ages 6–9 · parent attends', comm:575, res:1000, nights:3, blurb:'A parent trains alongside their young wrestler.'},
    {id:'kids6',    name:'Kids Training Camp', dur:'6-Day', dates:'6 days', comm:850, res:950, nights:5, blurb:'Six days built for younger wrestlers.'},
    {id:'superkid11',name:'SuperKid Technique & Training', dur:'11-Day', dates:'Jun 28 – Jul 8', comm:1750, res:1950, nights:10, tag:'Most serious', blurb:'Our deepest youth camp — eleven days.'},
  ],
};
const NIGHT_RATE = 50;
const usd = n => '$' + n.toLocaleString('en-US');

/* ---------- state + availability ---------- */
const S = { who:null, housing:null, campId:null, step:0 };
let AVAIL = null;
fetch('availability.json?v='+Date.now()).then(r=>r.json()).then(d=>{AVAIL=d;render();}).catch(()=>{});

const main = document.getElementById('main');
const say  = document.getElementById('say');
const prog = document.getElementById('prog');

function setSay(html){ say.innerHTML = html; }
function setProg(){ [...prog.children].forEach((i,ix)=> i.classList.toggle('on', ix <= S.step)); }
function who(){ return WHO.find(w=>w.id===S.who); }
function camp(){ return (CATALOG[S.who]||[]).find(c=>c.id===S.campId); }
function paOpenResident(){ return AVAIL?.pennsylvania?.residentSpotsLeft ?? 99; }

function nudgeHTML(){
  const n = paOpenResident();
  const u = AVAIL?.pennsylvania?.showNudgeUnder ?? 0;
  if (n > 0 && n <= u) return `<span class="nudge">🔥 Only ${n} resident spots left</span>`;
  return '';
}

/* ---------- steps ---------- */
function render(){
  setProg();
  if (S.step===0) return stepWho();
  if (S.step===1) return stepHousing();
  if (S.step===2) return stepCamp();
  return stepSummary();
}

function stepWho(){
  setSay("First — who are we getting on the mat? 💪");
  main.innerHTML = `<div class="step-h">Who's signing up?</div><div class="cards" id="c"></div>`;
  const c = document.getElementById('c');
  WHO.forEach(w=>{
    const b=document.createElement('button'); b.className='card'+(S.who===w.id?' sel':'');
    b.innerHTML=`<div class="ic">${w.ic}</div><div class="body"><div class="t">${w.t}</div><div class="d">${w.d}</div></div>`;
    b.onclick=()=>{ S.who=w.id; S.campId=null; S.step=1; render(); };
    c.appendChild(b);
  });
}

function stepHousing(){
  setSay(`Got it — <b>${who().t}</b>. Are they <b>staying with us</b>, or <b>driving in</b> each day?`);
  const nudge = nudgeHTML();
  main.innerHTML = `
    <button class="back" onclick="go(0)">← who</button>
    <div class="step-h">How will they attend?</div>
    <div class="cards">
      <button class="card ${S.housing==='res'?'sel':''}" onclick="pickHousing('res')">
        <div class="ic">🏨</div><div class="body"><div class="t">Resident — stay over</div><div class="d">Hotel room + all meals. The full camp experience.</div>${nudge}</div>
      </button>
      <button class="card ${S.housing==='comm'?'sel':''}" onclick="pickHousing('comm')">
        <div class="ic">🚗</div><div class="body"><div class="t">Commuter — drive in</div><div class="d">Attends each day, heads home at night. Lower price.</div></div>
      </button>
    </div>`;
}
function pickHousing(h){ S.housing=h; S.step=2; render(); }

function stepCamp(){
  const isRes = S.housing==='res';
  setSay(`Here are the real 2026 ${isRes?'resident':'commuter'} camps. Pick the one that fits your wrestler.`);
  let html = `<button class="back" onclick="go(1)">← stay or commute</button>
    <div class="step-h">Choose your camp</div><div class="cards">`;
  (CATALOG[S.who]||[]).forEach(c=>{
    const price = isRes ? c.res : c.comm;
    const sub = isRes ? `+ room ~${usd(c.nights*NIGHT_RATE)} at checkout` : 'meals on camp days incl.';
    html += `<button class="card ${S.campId===c.id?'sel':''}" onclick="pickCamp('${c.id}')">
        ${c.tag?`<span class="tag">${c.tag}</span>`:''}
        <div class="body"><div class="t">${c.name}</div><div class="d">${c.dur} · ${c.dates} — ${c.blurb}</div></div>
        <div class="price"><div class="big">${usd(price)}</div><div class="lab">${isRes?'resident':'commuter'}</div><div class="sub">${sub}</div></div>
      </button>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}
function pickCamp(id){ S.campId=id; S.step=3; render(); }

function stepSummary(){
  const c = camp(); const isRes = S.housing==='res';
  const base = isRes ? c.res : c.comm;
  setSay(`You're all set, Coach. 🏅 Here's your camp — tap below to lock it in.`);
  main.innerHTML = `
    <button class="back" onclick="go(2)">← choose camp</button>
    <div class="step-h">Confirm & reserve</div>
    <div class="receipt">
      <div class="top"><div class="nm">${c.name}</div><div class="dt">${c.dur} · ${c.dates} · Spooky Nook, PA</div></div>
      <div class="rrow"><span class="k">Wrestler</span><span class="v">${who().t}</span></div>
      <div class="rrow"><span class="k">Attending as</span><span class="v">${isRes?'Resident (hotel + meals)':'Commuter (drives in)'}</span></div>
      ${isRes?`<div class="rrow"><span class="k">Hotel room</span><span class="v">~${usd(c.nights*NIGHT_RATE)} · ${c.nights} nights @ $50</span></div>`:''}
      <div class="rtot"><span class="k">Camp tuition</span><span class="v">${usd(base)}<small>${isRes?'+ room & any extras at checkout':'+ any extras at checkout'}</small></span></div>
    </div>
    <a class="cta" href="${FORMS[S.who]}" target="_blank" rel="noopener" id="reserve">Reserve this spot <span class="arr">→</span></a>
    <div class="cta-sub">Next: secure checkout — a few wrestler details + payment. ~2 minutes.</div>
    <div class="ohio">🏟️ <b>Also coming to the Ohio camp</b> (Jul 18–23)? There's a <b>$100 multi-camp discount</b> — tap <b>Ask Coach</b> and we'll set it up.</div>
    <div class="fineprint">Prices are the real 2026 registration rates. Final lodging, add-ons (apparel, airport shuttle, PURE), and payment are completed on Coach Ken's secure RegFox checkout.</div>`;
}

function go(step){ S.step=step; render(); }

/* ---------- Ask Coach overlay ---------- */
const ov=document.getElementById('ov'), ovFrame=document.getElementById('ovFrame');
document.getElementById('askBtn').onclick=()=>{ if(!ovFrame.src) ovFrame.src='../ask-coach/'; ov.classList.add('show'); };
document.getElementById('ovClose').onclick=()=>ov.classList.remove('show');
ov.onclick=e=>{ if(e.target===ov) ov.classList.remove('show'); };

render();
</script>
</body>
</html>
