<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAT CLASH</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAT CLASH">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{
    --bk:#0a0909; --bk2:#161010; --panel:#1c1412;
    --ink:#f7f3ea; --dim:#a3937d; --line:#352b23;
    --gold:#c99527; --gold2:#f5c542; --red:#e41c26; --red2:#8f1218;
    --blue:#3da5f4; --purple:#a06bf2; --green:#3ecf8e; --cyan:#37d6d0;
    --grey:#8a8378; --orange:#f07f2d; --magenta:#e84f9b; --teal:#2bbfa3; --blood:#9e1b1b;
    --disp:'Anton',Impact,'Arial Black',sans-serif;
    --ui:'Oswald','Avenir Next Condensed','Helvetica Neue',Arial,sans-serif;
    --shadow:0 4px 16px rgba(0,0,0,.6);
    --cardw:82px; --cardh:118px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #241112 0%, var(--bk) 58%, #050404 100%);
    color:var(--ink); font-family:var(--ui);
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #app{max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  #sndbtn{position:absolute;top:calc(5px + env(safe-area-inset-top));right:6px;z-index:78;background:#000a;border:1px solid var(--line);color:var(--dim);
    width:34px;height:22px;font-size:0;font-weight:700;letter-spacing:.08em;padding:0;border-radius:0;cursor:pointer;font-family:var(--ui);}
  #sndbtn::after{content:"SFX";font-size:9px;}
  #sndbtn.on{color:var(--gold2);border-color:var(--gold);}
  /* ===== SF2 HUD: twin tech meters ===== */
  #hud{padding:calc(6px + env(safe-area-inset-top)) 10px 2px;}
  #hudrow{display:flex;align-items:stretch;gap:6px;}
  .hside{flex:1;min-width:0;}
  .hname{display:flex;align-items:baseline;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;white-space:nowrap;overflow:hidden;}
  .hside.right .hname{justify-content:flex-end;}
  .hname span:not(.hsc){min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .hsc{font-family:var(--disp);font-size:30px;line-height:1;color:var(--gold2);min-width:34px;text-align:center;transition:transform .15s;text-shadow:0 2px 0 #000;}
  .meter{height:18px;margin-top:3px;background:#221813;border:2px solid #00000088;outline:1px solid #ffffff22;position:relative;overflow:hidden;}
  .hside.active .hname{color:var(--gold2);}
  .hside.active .meter{outline:1.5px solid var(--gold2);}
  .mfill{position:absolute;top:0;bottom:0;left:0;width:0%;background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,#8a6210 100%);transition:width .4s cubic-bezier(.2,1.2,.4,1);}
  .hside.right .mfill{left:auto;right:0;}
  .mtick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red);}
  .hside.left .mtick{right:0;} .hside.right .mtick{left:0;}
  .mlab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:.22em;color:#ffffff7a;}
  #periodbox{width:46px;flex:none;text-align:center;align-self:center;}
  #periodbox .pd{font-family:var(--disp);font-size:21px;line-height:1;color:var(--ink);text-shadow:0 2px 0 #000;}
  #periodbox .pl{font-size:7.5px;font-weight:700;letter-spacing:.24em;color:var(--dim);margin-top:1px;}
  #oppstrip{display:flex;align-items:center;gap:8px;padding:2px 12px 0;min-height:16px;}
  .oppinfo{font-size:9.5px;color:var(--dim);font-weight:600;letter-spacing:.06em;}
  .oppthink{font-size:10px;color:var(--gold2);font-weight:700;letter-spacing:.1em;margin-left:auto;min-height:13px;}
  /* ===== STAGE / ARENA ===== */
  #stage{flex:1 1 auto;position:relative;min-height:206px;overflow:hidden;}
  #stage::after{content:"";position:absolute;inset:-8% -18%;z-index:5;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(105deg,transparent 0 24px,#ffffff38 25px 27px,transparent 28px 48px);
    mix-blend-mode:screen;transform:translateX(-48px) skewX(-10deg);}
  #stage.speed::after{animation:speedlines .38s ease-out;}
  @keyframes speedlines{0%{opacity:0;transform:translateX(-70px) skewX(-10deg)}28%{opacity:1}100%{opacity:0;transform:translateX(70px) skewX(-10deg)}}
  #arena{position:absolute;inset:0;}
  #arena .crowd{position:absolute;left:-4%;right:-4%;top:0;height:52%;
    background:linear-gradient(180deg,#070505 0%,#1d0f10 55%,#2a1314 100%);}
  #arena .crowd::after{content:"";position:absolute;inset:0;opacity:.5;
    background:radial-gradient(4px 4px at 12% 30%,#5a3a3a 40%,transparent 41%),radial-gradient(4px 4px at 26% 58%,#4a3030 40%,transparent 41%),radial-gradient(4px 4px at 39% 34%,#5a4040 40%,transparent 41%),radial-gradient(4px 4px at 52% 60%,#4a3232 40%,transparent 41%),radial-gradient(4px 4px at 66% 36%,#5a3c3c 40%,transparent 41%),radial-gradient(4px 4px at 80% 56%,#4a3030 40%,transparent 41%),radial-gradient(4px 4px at 92% 32%,#553a3a 40%,transparent 41%);
    background-size:120px 90px;filter:blur(1px);}
  #arena .spot{position:absolute;top:-12%;left:50%;width:150%;height:88%;transform:translateX(-50%);pointer-events:none;
    background:conic-gradient(from 168deg at 30% 0%,transparent 0deg,#fff2e055 7deg,transparent 15deg),conic-gradient(from 178deg at 70% 0%,transparent 0deg,#fff2e04d 7deg,transparent 15deg);
    mix-blend-mode:screen;}
  #arena .matfloor{position:absolute;left:-12%;right:-12%;bottom:-4%;height:56%;
    background:radial-gradient(120% 130% at 50% 0%,#3b1417 0%,#2a0e11 48%,#160809 100%);
    border-top:3px solid #531a1e;box-shadow:inset 0 14px 34px #00000088;}
  #arena .matring{position:absolute;left:50%;bottom:6%;width:88%;height:34%;transform:translateX(-50%);
    border:3px solid #e41c2655;border-radius:50%;}
  #arena .matlogo{position:absolute;left:50%;bottom:13%;width:130px;height:60px;transform:translateX(-50%);opacity:.1;
    background:url("assets/logo-matclash.png") center/contain no-repeat;filter:grayscale(.3) brightness(1.6);}
  .fighter{position:absolute;bottom:5%;width:43%;height:72%;max-width:190px;z-index:3;transform-origin:50% 82%;
    transition:bottom .45s cubic-bezier(.3,1.4,.5,1), filter .4s, transform .3s, left .5s cubic-bezier(.3,1.2,.4,1), right .5s cubic-bezier(.3,1.2,.4,1);}
  .fighter.fl.ride{left:20%;z-index:4;} .fighter.fr.ride{right:20%;z-index:4;}
  .fighter.under{z-index:3;}
  .fighter.under img{transition:transform .4s;}
  .fighter.fl.under img{transform:rotate(-8deg);} .fighter.fr.under img{transform:rotate(8deg);}
  .fighter::before{content:"";position:absolute;left:12%;right:12%;bottom:2%;height:13%;
    background:radial-gradient(ellipse,#000c 0%,#0008 44%,transparent 72%);filter:blur(1px);z-index:-1;
    transform:skewX(-8deg);}
  .fighter img{width:100%;height:100%;object-fit:contain;object-position:center bottom;
    border:0;outline:0;background:transparent;
    filter:drop-shadow(0 13px 9px #000e) drop-shadow(0 0 2px #000);
    animation:stancebob 2.4s ease-in-out infinite;}
  #fP{left:3%;} #fA{right:3%;}
  .fighter.fl img{transform:rotate(-2.2deg);} .fighter.fr img{transform:rotate(2.2deg);}
  @keyframes stancebob{0%,100%{translate:0 0}50%{translate:0 -2.5%}}
  .fighter .poschip{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);z-index:4;
    font-size:9px;font-weight:700;letter-spacing:.18em;padding:2px 9px;border:1.5px solid var(--line);
    background:#000c;color:var(--dim);white-space:nowrap;}
  .fighter.ontop{bottom:12%;} .fighter.ontop::before{background:radial-gradient(ellipse,#f5c54255 0%,#0009 48%,transparent 74%);}
  .fighter.ontop .poschip{color:#0a0909;background:var(--gold2);border-color:var(--gold2);}
  .fighter.onbot{bottom:2%;transform:scale(.92);} .fighter.onbot img{filter:drop-shadow(0 10px 12px #000c) brightness(.62);}
  .fighter.onbot .poschip{color:var(--ink);background:var(--red2);border-color:var(--red2);}
  .fighter.exposed::after{content:"BACK EXPOSED";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--gold2);text-shadow:0 1px 2px #000;animation:pulse 1s infinite;}
  @keyframes lungeL{0%{transform:translateX(0)}14%{transform:translateX(-9%) rotate(-3deg)}42%{transform:translateX(118%) translateY(4%) rotate(5deg)}58%{transform:translateX(118%) translateY(4%) rotate(5deg)}100%{transform:translateX(0)}}
  @keyframes lungeR{0%{transform:translateX(0)}14%{transform:translateX(9%) rotate(3deg)}42%{transform:translateX(-118%) translateY(4%) rotate(-5deg)}58%{transform:translateX(-118%) translateY(4%) rotate(-5deg)}100%{transform:translateX(0)}}
  @keyframes recoil2L{0%{transform:translateX(0)}34%{transform:translateX(-34%) rotate(-9deg)}62%{transform:translateX(-34%) rotate(-9deg)}100%{transform:translateX(0)}}
  @keyframes recoil2R{0%{transform:translateX(0)}34%{transform:translateX(34%) rotate(9deg)}62%{transform:translateX(34%) rotate(9deg)}100%{transform:translateX(0)}}
  .fighter.hit.fl{animation:recoil2L .6s cubic-bezier(.2,1,.4,1);} .fighter.hit.fr{animation:recoil2R .6s cubic-bezier(.2,1,.4,1);}
  @keyframes stuffAtkL{0%{transform:translateX(0)}30%{transform:translateX(76%) translateY(9%) rotate(8deg)}72%{transform:translateX(76%) translateY(11%) rotate(10deg)}100%{transform:translateX(0)}}
  @keyframes stuffAtkR{0%{transform:translateX(0)}30%{transform:translateX(-76%) translateY(9%) rotate(-8deg)}72%{transform:translateX(-76%) translateY(11%) rotate(-10deg)}100%{transform:translateX(0)}}
  @keyframes stuffDefL{0%{transform:translateX(0)}38%{transform:translateX(-86%) translateY(-7%)}55%{transform:translateX(-92%) translateY(2%)}78%{transform:translateX(-92%) translateY(2%)}100%{transform:translateX(0)}}
  @keyframes stuffDefR{0%{transform:translateX(0)}38%{transform:translateX(86%) translateY(-7%)}55%{transform:translateX(92%) translateY(2%)}78%{transform:translateX(92%) translateY(2%)}100%{transform:translateX(0)}}
  .fighter.stuffatk.fl{animation:stuffAtkL .95s cubic-bezier(.3,.9,.4,1);} .fighter.stuffatk.fr{animation:stuffAtkR .95s cubic-bezier(.3,.9,.4,1);}
  .fighter.stuffdef.fl{animation:stuffDefL .95s cubic-bezier(.3,.9,.4,1);z-index:5;} .fighter.stuffdef.fr{animation:stuffDefR .95s cubic-bezier(.3,.9,.4,1);z-index:5;}
  .freeze *{animation-play-state:paused!important;}
  #stage.punch{animation:stpunch .3s cubic-bezier(.2,1.6,.4,1);}
  @keyframes stpunch{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}
  .dust{position:absolute;width:10px;height:10px;border-radius:50%;background:#c9b89a;opacity:.8;z-index:4;pointer-events:none;
    animation:dustout .5s ease-out forwards;}
  @keyframes dustout{to{transform:translate(var(--dx),var(--dy)) scale(2.4);opacity:0;}}
  .meter.hot .mfill{box-shadow:0 0 14px 2px #f5c542cc;}
  #dimstage.show{display:block;animation:fadein .35s, dimpulse 1.9s ease-in-out .4s infinite;}
  @keyframes dimpulse{0%,100%{box-shadow:inset 0 0 60px #e41c2600}50%{box-shadow:inset 0 0 90px #e41c2638}}
  .fighter.atk.fl{animation:lungeL .62s cubic-bezier(.3,.9,.4,1);} .fighter.atk.fr{animation:lungeR .62s cubic-bezier(.3,.9,.4,1);}
  @keyframes recoilL{0%{transform:translateX(0)}30%{transform:translateX(-26%) rotate(-7deg)}60%{transform:translateX(-26%) rotate(-7deg)}100%{transform:translateX(0)}}
  @keyframes recoilR{0%{transform:translateX(0)}30%{transform:translateX(26%) rotate(7deg)}60%{transform:translateX(26%) rotate(7deg)}100%{transform:translateX(0)}}
  .fighter.hit.fl{animation:recoilL .55s cubic-bezier(.2,1,.4,1);} .fighter.hit.fr{animation:recoilR .55s cubic-bezier(.2,1,.4,1);}
  .fighter.hit img{filter:drop-shadow(0 10px 12px #000c) brightness(1.9) saturate(.6);}
  .fighter.flat.fl{transform:rotate(-84deg) translate(34%,22%);}
  .fighter.flat.fr{transform:rotate(84deg) translate(-34%,22%);}
  .fighter.over.fl{transform:translate(54%,9%) rotate(8deg);z-index:4;}
  .fighter.over.fr{transform:translate(-54%,9%) rotate(-8deg);z-index:4;}
  .fighter.spin{animation:spinrev .55s cubic-bezier(.3,.8,.4,1);}
  @keyframes spinrev{50%{transform:rotateY(180deg) scale(.92)}}
  .fighter.back.fl{animation:backoffL .6s;} .fighter.back.fr{animation:backoffR .6s;}
  @keyframes backoffL{40%{transform:translateX(-15%) rotate(-2deg)}}
  @keyframes backoffR{40%{transform:translateX(15%) rotate(2deg)}}
  #spark{position:absolute;left:50%;top:46%;width:138px;height:138px;transform:translate(-50%,-50%) scale(0);z-index:6;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#ffe9a8 22%,#f5c542 38%,#f07f2d 52%,transparent 64%);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
  #spark.go{animation:sparkpop .34s cubic-bezier(.2,1.6,.4,1);}
  @keyframes sparkpop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:1}60%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.7) rotate(14deg);opacity:0}}
  #moveburst{position:absolute;left:50%;top:58%;z-index:8;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%) skewX(-8deg) scale(.86);padding:6px 13px;border:2px solid #000;
    background:var(--mb,var(--gold2));color:#080404;font-family:var(--disp);font-size:26px;line-height:.9;
    text-transform:uppercase;box-shadow:0 5px 0 #000,0 0 24px #f5c54288;white-space:nowrap;}
  #moveburst b{margin-left:7px;color:#fff;text-shadow:0 2px 0 #000;-webkit-text-stroke:1px #000;}
  #moveburst.go{animation:moveburst .82s cubic-bezier(.2,1.8,.4,1) forwards;}
  @keyframes moveburst{0%{opacity:0;transform:translate(-50%,-50%) skewX(-8deg) scale(.3) rotate(-4deg)}18%{opacity:1;transform:translate(-50%,-50%) skewX(-8deg) scale(1.12) rotate(-2deg)}74%{opacity:1}100%{opacity:0;transform:translate(-50%,-88%) skewX(-8deg) scale(.9) rotate(2deg)}}
  #threat{position:absolute;left:0;right:0;top:2px;z-index:6;text-align:center;font-size:10px;font-weight:700;
    letter-spacing:.18em;color:var(--red);text-shadow:0 1px 3px #000;min-height:14px;text-transform:uppercase;}
  #threat.hot{animation:pulse .9s infinite;}
  .flypt{position:absolute;z-index:66;font-family:var(--disp);font-size:30px;color:var(--gold2);
    text-shadow:0 0 12px #f5c54288,0 3px 0 #000;pointer-events:none;transition:all .75s cubic-bezier(.3,.7,.4,1);}
  /* CHAIN LADDER */
  #chain{padding:2px 12px 0;min-height:56px;}
  #chainrow{display:flex;align-items:center;gap:5px;min-height:30px;}
  #chainlinks{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;}
  .clink{padding:3px 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;font-family:var(--ui);
    background:#1c1412;border:1.5px solid var(--line);color:var(--dim);opacity:.35;transform:scale(.85) skewX(-8deg);
    transition:all .25s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;}
  .clink.lit{opacity:1;transform:scale(1) skewX(-8deg);color:#0a0909;}
  .clink.arrow{background:none;border:none;color:var(--gold2);padding:0;font-size:12px;opacity:.35;}
  .clink.arrow.lit{opacity:1;color:var(--gold2);}
  #chaintotal{font-family:var(--disp);font-variant-numeric:tabular-nums;color:var(--gold2);text-align:right;
    min-width:74px;line-height:1;transition:transform .18s cubic-bezier(.3,2,.5,1);font-size:23px;text-shadow:0 0 14px #f5c54255,0 2px 0 #000;}
  #chaintotal small{display:block;font-size:8px;letter-spacing:.18em;color:var(--dim);font-weight:700;font-family:var(--ui);}
  #chainlabel{font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--dim);margin-bottom:2px;}
  #chainlabel b{color:var(--gold2);}
  /* LOG */
  #log{padding:2px 12px;font-size:11px;line-height:1.4;color:var(--dim);min-height:32px;font-weight:600;}
  #log .l0{color:var(--ink);}
  #log b{color:var(--gold2);}
  #movehint{margin:0 12px 2px;min-height:26px;max-height:34px;border:1.5px solid #3d3024;background:linear-gradient(90deg,#130c0bea,#080606d0);
    padding:4px 8px;font-size:10px;line-height:1.2;color:var(--dim);font-weight:700;letter-spacing:.04em;overflow:hidden;}
  #movehint b{color:var(--gold2);}
  #movehint.warn b{color:var(--red);}
  /* HAND */
  #handwrap{padding:2px 6px calc(6px + env(safe-area-inset-bottom));}
  #handlabel{display:flex;justify-content:space-between;align-items:center;padding:0 8px 4px;}
  #handlabel .you{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--dim);}
  #handlabel .you.live{color:var(--gold2);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #handbtns{display:flex;gap:6px;}
  .minibtn{background:#1c1412;border:1.5px solid var(--line);color:var(--ink);font-size:10px;font-weight:700;font-family:var(--ui);
    letter-spacing:.08em;padding:5px 11px;cursor:pointer;}
  .minibtn:disabled{opacity:.35;}
  .minibtn.warn{border-color:var(--red);color:var(--red);}
  #hand{display:flex;justify-content:center;align-items:flex-end;min-height:126px;padding-bottom:2px;}
  .card{width:var(--cardw);height:var(--cardh);border-radius:7px;flex:none;position:relative;cursor:pointer;overflow:hidden;
    margin-left:-18px;background:#1c1412 var(--cimg,none) center/cover no-repeat;
    border:2px solid #00000088;outline:1.5px solid #ffffff2e;box-shadow:0 3px 10px #000a;
    transition:transform .16s, margin .16s;transform:rotate(var(--rot,0deg)) translateY(var(--ty,0px));}
  .card:first-child{margin-left:0;}
  .card .strip{position:absolute;left:0;right:0;bottom:0;padding:8px 3px 3px;text-align:center;
    background:linear-gradient(180deg,transparent 0%,#000000d9 46%);}
  .card .nm{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;color:var(--ink);text-shadow:0 1px 2px #000;}
  .card .pv{position:absolute;top:2px;left:2px;min-width:27px;padding:2px 4px;text-align:center;font-family:var(--disp);
    font-size:18px;color:#fff;background:#000000e6;border:2px solid var(--cc,#555);border-radius:5px;text-shadow:0 1px 0 #000;}
  .card .tag{position:absolute;top:3px;right:3px;font-size:7px;font-weight:700;letter-spacing:.05em;color:#fff;background:#000b;padding:1px 4px;}
  .card.dead{filter:grayscale(.92) brightness(.45);}
  .card.playable{z-index:2;outline-color:var(--gold2);box-shadow:0 3px 10px #000a, 0 0 13px -2px var(--gold2);}
  .card.playable:active{transform:rotate(0) translateY(-14px) scale(1.06);z-index:9;}
  .card.raised{z-index:30;transform:rotate(0deg) translateY(-20px) scale(1.08);outline-color:var(--gold2);}
  /* big cards in sheets */
  .bigcard{width:96px;height:138px;margin-left:0;}
  .bigcard .nm{font-size:9.5px;}
  .bigcard .pv{font-size:21px;min-width:31px;}
  /* OVERLAYS */
  .overlay{position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(130% 55% at 50% 96%,#3b1417e8 0%,#1c0a0cf0 52%,#1c0a0c00 78%),conic-gradient(from 178deg at 28% -4%,transparent 0deg,#f5e9d00d 6deg,transparent 13deg),conic-gradient(from 182deg at 72% -4%,transparent 0deg,#f5e9d00a 6deg,transparent 13deg),linear-gradient(180deg,#080404f6 0%,#170b0cf2 55%,#0c0506f8 100%);
    backdrop-filter:blur(3px);padding:18px;text-align:center;animation:fadein .2s;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .overlay h2{font-family:var(--disp);font-size:25px;font-weight:400;letter-spacing:.03em;line-height:1.12;text-transform:uppercase;
    color:var(--ink);text-shadow:0 3px 0 #000, 0 0 22px #e41c2644;}
  .overlay .sub{color:var(--dim);font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.5;max-width:310px;}

let sndOn=false, actx=null, AU=null;
function audioInit(){
  if(AU)return AU;

    actx=actx||new (window.AudioContext||window.webkitAudioContext)();

    const comp=actx.createDynamicsCompressor();

    const amb=actx.createGain(); amb.gain.value=0;   amb.connect(master);
    const fx=actx.createGain();  fx.gain.value=.8;   fx.connect(master);
    const nb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=nb.getChannelData(0); let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2;}

    crowdSrc.connect(cf); cf.connect(amb); crowdSrc.start();

  o.connect(g);g.connect(AU.fx);o.start(t);o.stop(t+dur+.02);
}
function fxNoise(dur,fHz,vol,when){
  if(!sndOn||!audioInit())return;

  if(SAMP.loaded)return; SAMP.loaded=true;

/* ---------- legality ---------- */
function isTop(s){return S.top===s;}

function pinBlockReason(s){
  const o=S[other(s)];
  const need=S.dualMode?2:1;
  if((S.transCount||0)<need) return "Illegal before the "+(need===2?"second":"first")+" transition is complete.";
  if(S[s].justStalled) return "Can't go for it directly after your own Stalling.";
  if(o.unpinnable) return o.ch.nm+" played Resilience — unpinnable.";

}
// mode: "action" | "bonus" (free near-fall window) | "chain"
function legality(s,k,mode){
  const me=S[s];
  if(mode==="bonus"){
    if(k==="SPLA"||k.startsWith("NF")) return {ok:true};
    return {ok:false,why:"Back is exposed — only Near Fall or Spladle right now."};
  }
  if(mode==="chain"){
    if(k==="MOM"||k==="BEAST") return {ok:true};
    if(k==="CUTEM") return S.lastLandedTD===s?{ok:true}:{ok:false,why:"Only directly after your Takedown scores."};
    return {ok:false,why:"Between turns only Momentum (or Cut 'Em after a Takedown) keeps the chain alive."};
  }
  switch(k){
    case "TD": return isNeutral()?{ok:true}:{ok:false,why:"Takedowns start from neutral."};
    case "FTB": return isNeutral()?{ok:true}:{ok:false,why:"Feet to Back starts from neutral."};
    case "ESC": return isBottom(s)?{ok:true}:{ok:false,why:"Escape from bottom (or to answer a Takedown)."};
    case "REV": return isBottom(s)?{ok:true}:{ok:false,why:"Reversal from bottom (or to answer a Takedown)."};
    case "ESC2": return {ok:false,why:"Answer card — play it when the opponent hits a Takedown."};
    case "DEF": return {ok:false,why:"Answer card — play it against a Takedown, Reversal, or Pin."};
    case "SCRAM": return {ok:false,why:"Answer card — play it the moment the opponent hits a Takedown."};
    case "CLONE": return {ok:false,why:"Answer card — play it against a Takedown or Feet to Back."};
    case "MOM": return {ok:false,why:"Chain card — play it right AFTER one of your own cards."};
    case "CUTEM": return {ok:false,why:"Chain card — play it right after your Takedown scores."};
    case "STALL": return {ok:true};
    case "NF2":case "NF3":case "NF4":case "NF5":
      if(!isTop(s)) return {ok:false,why:"Near Fall needs top control."};
      if(S.exposed!==s) return {ok:false,why:"Back not exposed — hit Takedown then Momentum first."};
      return {ok:true};
    case "SPLA":
      if(!isTop(s)) return {ok:false,why:"Spladle needs top control."};
      if(S.exposed!==s) return {ok:false,why:"Back not exposed — hit Takedown then Momentum first."};
      return {ok:true};
    case "PIN":{
      if(!isTop(s)) return {ok:false,why:"You need top control to pin."};
      const r=pinBlockReason(s); return r?{ok:false,why:r}:{ok:true};
    }
    case "MB":{
      const r=pinBlockReason(s); return r?{ok:false,why:r}:{ok:true};
    }
    case "CMBK": return {ok:true};
    case "WIZ": return {ok:true};
    case "RESIL": return {ok:true};
    case "BEAST":{
      const ms=beastModes(s,mode);
      return ms.length?{ok:true}:{ok:false,why:"No legal wild use right now."};
    }
  }
  return {ok:false,why:"Not playable now."};
}
function beastModes(s,mode){
  const out=[];
  if(mode==="chain"){ out.push("MOM"); return out; } // wild as Momentum keeps the chain
  if(mode==="bonus") return out;
  if(isNeutral()) out.push("TD");
  if(isBottom(s)){ out.push("ESC"); out.push("REV"); }
  out.push("STALL");
  return out;
}
// answers available vs a pending card kind
function answerOptions(defSide,vsKind){
  const hand=S[defSide].hand, opts=[];
  const has=k=>hand.includes(k);
  const add=(k,as)=>opts.push({k,as:as||k});
  if(vsKind==="TD"){
    if(has("SCRAM"))add("SCRAM"); if(has("CLONE"))add("CLONE");
    if(has("REV"))add("REV"); if(has("ESC"))add("ESC"); if(has("ESC2"))add("ESC2"); if(has("DEF"))add("DEF");
    if(has("BEAST")){add("BEAST","REV");add("BEAST","ESC");add("BEAST","DEF");}
  }else if(vsKind==="FTB"){
    if(has("DEF"))add("DEF"); if(has("CLONE"))add("CLONE");
    if(has("BEAST"))add("BEAST","DEF");
  }else if(vsKind==="REV"){ // opponent reversed from bottom
    if(has("DEF"))add("DEF"); if(has("REV"))add("REV");
    if(has("BEAST")){add("BEAST","DEF");add("BEAST","REV");}
  }else if(vsKind==="CREV"){ // counter window: defense only
    if(has("DEF"))add("DEF"); if(has("BEAST"))add("BEAST","DEF");
  }else if(vsKind==="PIN"){
    if(has("DEF"))add("DEF"); if(has("BEAST"))add("BEAST","DEF");
  }else if(vsKind==="MB"||vsKind==="SPLA"){
    if(has("BEAST"))add("BEAST","BEAST");
  }
  return opts;
}

/* Momentum can be chained directly onto your own Takedown to deny the
   opponent's answer window (official Near Fall trigger: "Momentum played
   directly after a Takedown"). */
async function offerMomDeny(s){
  const me=S[s];
  const hasMom=me.hand.includes("MOM"), hasBeast=me.hand.includes("BEAST");
  if(!hasMom&&!hasBeast)return null;
  if(me.isAI){
    const want=(biggestNF(s)||me.hand.includes("SPLA"))&&Math.random()<.85;
    return want?(hasMom?"MOM":(Math.random()<.3?"BEAST":null)):null;
  }
  if(AUTOPLAY)return Math.random()<.5?(hasMom?"MOM":"BEAST"):null;
  const ok=await confirmDialog("CHAIN MOMENTUM?",
    "Burn "+(hasMom?"MOMENTUM":"BEASTIN' (as Momentum)")+" to deny the answer window — the takedown lands clean and the back is <b style='color:var(--gold)'>EXPOSED</b> for Near Falls.",
    "DENY THE ANSWER","LET THEM ANSWER");
  return ok?(hasMom?"MOM":"BEAST"):null;
}

/* resolvePlay returns flags: {continueTurn, bonusNF, landedTD} */
async function resolvePlay(s,action){
  const o=other(s), me=S[s], opp=S[o];
  const k=action.k, as=action.as||k;
  removeCard(s,k);
  announce(s,k,action.as);
  if(as!=="STALL")clearStall(s);
  const res={continueTurn:false,bonusNF:false,landedTD:false};
  S.lastLandedTD=null;

  switch(as){
    case "TD":{
      await sleep(420);
      const deny=await offerMomDeny(s);
      if(deny){
        removeCard(s,deny);
        markTrans();
        gain(s,3); S.top=s; S.exposed=s; renderMat();
        chainAdd(s,"TAKEDOWN",3,"var(--red)");
        chainAdd(s,"MOMENTUM",0,"var(--cyan)");
        logMsg("<b>"+me.ch.nm+"</b> takedown +3 — MOMENTUM denies the answer! <b>Back exposed!</b>");
        await banner("TAKEDOWN +3","red",650); shake(false);
        await banner("MOMENTUM — NO ANSWER","dark",750);
        res.landedTD=true; S.lastLandedTD=s; res.continueTurn=true;
        break;
      }
      const ans=await getAnswer(o,"TD",s);
      markTrans();
      if(!ans){
        gain(s,3); S.top=s; renderMat();
        chainAdd(s,"TAKEDOWN",3,"var(--red)");
        logMsg("<b>"+me.ch.nm+"</b> +3 — no answer. <b>Back exposed!</b>");
        S.exposed=s; res.bonusNF=true; res.landedTD=true; S.lastLandedTD=s;
        await banner("TAKEDOWN +3","red",750); shake(false);
      }else{
        removeCard(o,ans.k);
        if(ans.as==="DEF"){
          gain(s,0); logMsg("<b>"+opp.ch.nm+"</b> DEFENDS — takedown nullified.");
          await banner("DEFENDED","blue",700);
        }else if(ans.as==="ESC"||ans.k==="ESC2"){
          const ep=ans.k==="ESC2"?2:1;
          gain(s,3); gain(o,ep); S.top=null; renderMat();
          choreo("ESC",o);
          logMsg("<b>"+me.ch.nm+"</b> +3, but <b>"+opp.ch.nm+"</b> escapes +"+ep+".");
          await banner("ESCAPE +"+ep,"blue",700);
        }else if(ans.as==="REV"){
          gain(s,3);
          logMsg("<b>"+opp.ch.nm+"</b> answers with a REVERSAL...");
          await sleep(300);
          const counter=await getAnswer(s,"CREV",o);
          if(counter){
            removeCard(s,counter.k);
            logMsg("<b>"+me.ch.nm+"</b> DEFENDS the reversal — keeps top!");
            S.top=s; renderMat(); await banner("REVERSAL DENIED","blue",750);
            res.landedTD=true; S.lastLandedTD=s;
          }else{
            gain(o,2); S.top=o; renderMat();
            choreo("REV",o);
            chainReset(o); chainAdd(o,"REVERSAL",2,"var(--purple)");
            logMsg("<b>"+opp.ch.nm+"</b> reverses! +2 and takes top.");
            await banner("REVERSAL +2","red",800); shake(false);
          }
        }else if(ans.k==="SCRAM"){
          gain(o,5); S.top=o; renderMat();
          chainReset(o); chainAdd(o,"SCRAMBLE",5,"var(--teal)");
          logMsg("<b>"+opp.ch.nm+"</b> SCRAMBLES — takedown erased, +5, takes top!");
          await banner("SCRAMBLE +5","red",850); shake(true);
        }else if(ans.k==="CLONE"){
          gain(s,3); gain(o,3); S.top=null; renderMat();
          logMsg("<b>"+opp.ch.nm+"</b> CLONES the takedown — both +3, back to neutral.");
          await banner("CLONED +3","blue",750);
        }
        if(S.top===s){
          res.landedTD=true;S.lastLandedTD=s;
          chainAdd(s,"TAKEDOWN",3,"var(--red)");
        }
      }
      break;
    }
    case "FTB":{
      await sleep(420);
      logMsg("<b>"+me.ch.nm+"</b> FEET TO BACK — pin threat!");
      const ans=await getAnswer(o,"FTB",s);
      markTrans();
      gain(s,7);
      chainAdd(s,"FEET TO BACK",7,"var(--magenta)");
      if(!ans){
        await pinDrama(s,"FTB",null);
        return res;
      }
      removeCard(o,ans.k);
      if(ans.k==="CLONE"){
        gain(o,7); S.top=null; renderMat();
        logMsg("<b>"+opp.ch.nm+"</b> CLONES it — both +7!"); await banner("CLONED +7","blue",800);
      }else{
        S.top=s; renderMat(); S.exposed=s; res.bonusNF=true;
        logMsg("<b>"+opp.ch.nm+"</b> defends the pin — but +7 stands. <b>Back exposed!</b>");
        await banner("FEET TO BACK +7","gold",850); shake(true);
      }
      break;
    }
    case "ESC":{ // turn action from bottom (or beast as escape)
      gain(s,1); S.top=null; renderMat();
      choreo("ESC",s);
      chainAdd(s,"ESCAPE",1,"var(--blue)");
      logMsg("<b>"+me.ch.nm+"</b> escapes +1 — back to neutral.");
      await banner("ESCAPE +1","blue",650);
      break;
    }
    case "REV":{ // turn action from bottom
      await sleep(420);
      const ans=await getAnswer(o,"REV",s);
      if(!ans){
        gain(s,2); S.top=s; renderMat();
        choreo("REV",s);
        chainAdd(s,"REVERSAL",2,"var(--purple)");
        logMsg("<b>"+me.ch.nm+"</b> REVERSAL +2 — takes top!");
        await banner("REVERSAL +2","gold",750); shake(false);
      }else{
        removeCard(o,ans.k);
        if(ans.as==="DEF"){
          logMsg("<b>"+opp.ch.nm+"</b> defends the reversal — nothing doing.");
          await banner("DEFENDED","blue",700);
        }else{ // counter reversal
          gain(s,2);
          logMsg("<b>"+opp.ch.nm+"</b> counter-reversal!");
          await sleep(300);
          const cc=await getAnswer(s,"CREV",o);
          if(cc){
            removeCard(s,cc.k);
            S.top=s; renderMat();
            logMsg("<b>"+me.ch.nm+"</b> defends the counter — +2 and top stands!");
            await banner("COUNTER DENIED","gold",750);
          }else{
            gain(o,2); renderMat();
            logMsg("Both score +2 — <b>"+opp.ch.nm+"</b> stays on top.");
            await banner("COUNTERED +2","red",750);
          }
        }
      }
      break;
    }
    case "STALL":{
      gain(o,1); me.justStalled=true;
      if(S.deck.length){me.hand.push(S.deck.pop());}
      choreo("STALL",s);
      chainAdd(s,"STALLING",-1,"var(--grey)");
      logMsg("<b>"+me.ch.nm+"</b> stalls — "+opp.ch.nm+" +1, draws a card, keeps the turn.");
      sfx.bad();
      res.continueTurn=true;
      break;
    }
    case "MOM":{
      chainAdd(s,"MOMENTUM",0,"var(--cyan)");
      if(action.fromChain&&(S.lastChainTD===s||S.exposed===s)){S.exposed=s;}
      logMsg("<b>"+me.ch.nm+"</b> rides the MOMENTUM — goes again!");
      await banner("MOMENTUM","dark",650);
      res.continueTurn=true;
      break;
    }
    case "NF2":case "NF3":case "NF4":case "NF5":{
      const p=C[as].pts;
      logMsg("<b>"+me.ch.nm+"</b> cranks back points...");
      choreo("NF",s);
      await refCount(2);
      gain(s,p);
      chainAdd(s,"NEAR FALL",p,"var(--gold)");
      await banner("NEAR FALL +"+p,"gold",800); shake(p>=4);
      break;
    }
    case "SPLA":{
      gain(s,4);
      choreo("NF",s);
      chainAdd(s,"SPLADLE",4,"var(--magenta)");
      logMsg("<b>"+me.ch.nm+"</b> SPLADLE! +4 — and the pin is live!");
      await banner("SPLADLE +4","gold",750); shake(true);
      await pinDrama(s,"SPLA",null);
      return res;
    }
    case "PIN":{ await pinDrama(s,"PIN",null); return res; }
    case "MB":{ await pinDrama(s,"MB",null); return res; }
    case "CUTEM":{
      gain(o,1); S.top=null; renderMat();
      chainAdd(s,"CUT 'EM",-1,"var(--teal)");
      logMsg("<b>"+me.ch.nm+"</b> cuts "+opp.ch.nm+" loose (+1) — hunting another takedown!");
      res.continueTurn=true;
      break;
    }
    case "CMBK":{
      const before=me.score;
      if(me.score<opp.score)me.score=opp.score;
      S.top=s; renderMat(); renderScores();
      chainAdd(s,"COMEBACK",me.score-before,"var(--teal)");
      logMsg("<b>"+me.ch.nm+"</b> COMEBACK — score tied at "+me.score+", takes top!");
      await banner("COMEBACK","gold",850); shake(true);
      break;
    }
    case "WIZ":{
      let cut=0;
      for(let i=0;i<3&&opp.hist.length;i++)cut+=opp.hist.pop();
      opp.score=Math.max(0,opp.score-cut);
      S.top=s; renderMat(); renderScores(); bumpScore(o);
      chainAdd(s,"WIZARDRY",0,"var(--purple)");
      logMsg("<b>"+me.ch.nm+"</b> WIZARDRY — erases "+cut+" of "+opp.ch.nm+"'s points, takes top!");
      await banner("WIZARDRY −"+cut,"dark",900); shake(true);
      break;
    }
    case "RESIL":{
      me.unpinnable=true;
      chainAdd(s,"RESILIENCE",0,"var(--green)");
      logMsg("<b>"+me.ch.nm+"</b> is UNPINNABLE for the rest of the match — and goes again!");
      await banner("RESILIENCE","blue",800);
      res.continueTurn=true;
      break;
    }
  }
  renderOpp();
  if(await checkTech())return res;
  return res;
}

/* ---------- pin drama ---------- */
async function pinDrama(s,kind,preAns){
  const o=other(s), me=S[s], opp=S[o];
  const vs=kind==="FTB"?null:(kind==="SPLA"?"SPLA":kind); // FTB undefended = auto pin
  $("dimstage").classList.add("show");
  if(!AUTOPLAY){duckMusic(true);heart(true);crowd(.5);}
  choreo("PINHOLD",s);
  oppThink("");
  const label=kind==="MB"?me.ch.nm.toUpperCase()+" UNLEASHES MAT BEAST":me.ch.nm.toUpperCase()+" GOES FOR THE PIN";
  await banner(label,"dark",1000);
  sfx.slam();
  let ans=null;
  if(vs){
    // ref starts counting, answer revealed at 2
    await refShow(1);
    ans=await getAnswer(o,vs,s);
    if(ans===undefined)ans=null;
  }
  if(vs&&ans){
    removeCard(o,ans.k);
    await refShow(2,500);
    // blocked — hero moment
    clearRef();
    choreo("KICKOUT",s);
    sfx.hero(); flash(); shake(true);
    bark(o,"kickout");
    const heroTxt=kind==="MB"?"BEASTIN'! MAT BEAST DENIED!":(opp.side==="p"?"YOU KICK OUT!":opp.ch.nm.toUpperCase()+" KICKS OUT!");
    await banner(heroTxt,"blue",1300);
    logMsg("<b>"+opp.ch.nm+"</b> "+(kind==="MB"?"goes BEASTIN' — Mat Beast denied!":"blocks the pin — match goes on!"));
    $("dimstage").classList.remove("show");
    if(!AUTOPLAY){heart(false);music("match");}
    renderOpp();
    if(!S.over)await checkTech();
    return false;
  }
  // pinned
  if(vs){await refShow(2);}else{await refShow(1);await refShow(2);}
  const three=el("span","refnum","3!");
  three.style.color="var(--red)";
  $("refcount").innerHTML="";$("refcount").appendChild(three);
  sfx.slam(); flash(); shake(true);
  if(!AUTOPLAY)heart(false);
  await sleep(700); clearRef();
  $("dimstage").classList.remove("show");
  const how=kind==="MB"?"MAT BEAST":(kind==="FTB"?"FEET TO BACK — PINNED":(kind==="SPLA"?"SPLADLE PIN":"PIN"));
  await endMatch(s,how,kind==="MB"?"The beast cannot be stopped":"Shoulders flat — the ref slaps the mat");
  return true;
}

async function endByScore(){
  if(S.over)return;
  const d=S.p.score-S.a.score;
  if(d===0){await overtime();return;}
  const winner=d>0?"p":"a";
  const m=Math.abs(d);
  const how=m>=15?"TECH FALL":(m>=8?"MAJOR DECISION":"DECISION");
  await endMatch(winner,how,"Out of moves — it goes to the scorecards");
}
async function overtime(){
  logMsg("<b>TIED!</b> Sudden-victory draw...");
  if(!AUTOPLAY)await banner("OVERTIME","dark",1100);
  let guard=0;
  while(guard++<30){
    if(S.deck.length<2){ // exhausted: coin flip via guard
      await endMatch(rnd(2)?"p":"a","DECISION (OT)","The tiebreaker draw ran the deck dry — judges' call");return;
    }
    const first=S.starterLoser||"p", second=other(first);
    const c1=S.deck.pop(), c2=S.deck.pop();
    const cards={[first]:c1,[second]:c2};
    logMsg("OT draw — <b>"+S.p.ch.nm+"</b>: "+C[cards.p].nm+" vs <b>"+S.a.ch.nm+"</b>: "+C[cards.a].nm);
    if(!AUTOPLAY){
      const o=el("div","overlay");
      o.appendChild(el("h2","","OVERTIME DRAW"));
      const row=el("div","sheetcards");
      const w1=el("div","",""),w2=el("div","","");
      w1.appendChild(cardEl(cards.p,true));w1.appendChild(el("div","sub","YOU"));
      w2.appendChild(cardEl(cards.a,true));w2.appendChild(el("div","sub",S.a.ch.nm.toUpperCase()));
      row.appendChild(w1);row.appendChild(w2);
      o.appendChild(row);
      $("ovl").appendChild(o);
      await sleep(1600); o.remove();
    }
    const r1=otRank(cards.p),r2=otRank(cards.a);
    const v1=r1[0]*1000+r1[1], v2=r2[0]*1000+r2[1];
    if(v1===v2){logMsg("Dead even — draw again!");continue;}
    const winner=v1>v2?"p":"a";
    await endMatch(winner,"DECISION (OT)",C[cards[winner]].nm+" takes the sudden-victory draw");
    return;
  }
}

  HM:{agg:1.15,pin:1.1,stall:.5,style:"PURE POWER"}, NT:{agg:.9,pin:.95,stall:.8,style:"CLINICAL"},
  SH:{agg:.95,pin:1.45,stall:1,style:"OFF THE RADAR"}, MB:{agg:1.45,pin:1.6,stall:.3,style:"LIKE A BEAST"},
  SK:{agg:1.35,pin:1.1,stall:.6,style:"IN CHAOS"}, ST:{agg:.7,pin:.8,stall:1.3,style:"BY THE BOOK"},
  CC:{agg:.75,pin:.9,stall:1.4,style:"CAGEY"}, CZ:{agg:.7,pin:.85,stall:1.4,style:"ON THE WHISTLE"},
  SV:{agg:1.4,pin:1.25,stall:.4,style:"NO MERCY"}, FE:{agg:1.35,pin:1.15,stall:.5,style:"UNTAMED"},
  BR:{agg:1.2,pin:1.3,stall:.6,style:"HEAVY-HANDED"}, WF:{agg:1.05,pin:1.2,stall:.9,style:"PATIENT, THEN SAVAGE"},
  SS:{agg:1.15,pin:1.05,stall:.7,style:"FOR THE FAMILY"}, GR:{agg:1.1,pin:.95,stall:1.1,style:"UGLY ON PURPOSE"},
  XA:{agg:1.2,pin:1.1,stall:.7,style:"WIRED WRONG"}, KA:{agg:1.05,pin:1.05,stall:.9,style:"OCEAN DEEP"},
  MW:{agg:.95,pin:1.2,stall:1,style:"WITH SORCERY"}
};
const persOf=ch=>PERS[ch.id]||{agg:1,pin:1,stall:1,style:"HARD-NOSED"};
function aiHas(k){return S.a.hand.includes(k);}
function biggestNF(s){
  const order=["NF5","NF4","NF3","NF2"];
  for(const k of order)if(S[s].hand.includes(k))return k;
  return null;
}
function aiAnswer(side,vsKind,opts){
  if(TUTOR)return null;
  if(!opts.length)return null;
  const me=S[side],opp=S[other(side)];
  const find=(k,as)=>opts.find(o=>o.k===k&&(!as||o.as===as));
  if(vsKind==="PIN")return find("DEF")||find("BEAST","DEF")||null;
  if(vsKind==="MB"||vsKind==="SPLA")return opts[0]||null;
  if(vsKind==="FTB")return find("DEF")||find("BEAST","DEF")||find("CLONE")||null;
  if(vsKind==="CREV")return (Math.random()<.8?(find("DEF")||find("BEAST","DEF")):null);
  if(vsKind==="REV"){
    if(find("DEF")&&Math.random()<.75)return find("DEF");
    if(find("REV")&&Math.random()<.6)return find("REV");
    return find("DEF")||null;
  }
  // vs TD
  if(find("SCRAM")&&Math.random()<.9)return find("SCRAM");
  const defCount=me.hand.filter(k=>k==="DEF").length;
  const pinThreatLater=S.firstTrans||true; // pins legal soon either way
  if(find("REV")&&Math.random()<.7)return find("REV");
  if(find("ESC"))return find("ESC");
  if(find("ESC2"))return find("ESC2");
  if(find("DEF")){
    // save the last Defense for a pin threat sometimes
    if(defCount<=1&&S.firstTrans&&opp.hand.length>2&&Math.random()<.45)return null;
    return find("DEF");
  }
  if(find("REV"))return find("REV");
  if(find("CLONE")&&Math.random()<.6)return find("CLONE");
  if(find("BEAST","REV")&&Math.random()<.3)return find("BEAST","REV"); // usually saves the wild
  return null;
}
function aiAction(mode){
  const me=S.a,opp=S.p,s="a";
  const P=persOf(me.ch);
  const has=k=>me.hand.includes(k);
  const leg=k=>legality(s,k,mode).ok;
  if(mode==="bonus"){
    if(has("SPLA")&&leg("SPLA"))return {type:"play",k:"SPLA",idx:me.hand.indexOf("SPLA")};
    const nf=biggestNF(s);
    if(nf&&leg(nf))return {type:"play",k:nf,idx:me.hand.indexOf(nf)};
    return {type:"pass"};
  }
  if(mode==="chain"){
    const nf=biggestNF(s);
    // momentum worth it if it unlocks near fall / spladle / another takedown
    if(has("MOM")&&((S.lastLandedTD==="a"&&(nf||has("SPLA")))||(S.top===null&&has("TD"))||(S.exposed==="a"&&nf)))
      return {type:"play",k:"MOM",idx:me.hand.indexOf("MOM"),fromChain:true};
    if(has("CUTEM")&&S.lastLandedTD==="a"&&has("TD")&&me.hand.length>3&&Math.random()<.6)
      return {type:"play",k:"CUTEM",idx:me.hand.indexOf("CUTEM")};
    return {type:"pass"};
  }
  // action mode
  const lead=me.score-opp.score;
  // finishers
  if(has("MB")&&leg("MB")&&(lead<-4||S.round>=4||Math.random()<.3*P.pin))return {type:"play",k:"MB",idx:me.hand.indexOf("MB")};
  if(has("PIN")&&leg("PIN")){
    let p=.3;
    if(S.playerPassedAnswer)p+=.3;
    if(S.round>=4)p+=.2;
    if(lead<=-8)p+=.25;
    if(opp.hand.length<=2)p+=.25;
    p*=P.pin;
    if(Math.random()<p)return {type:"play",k:"PIN",idx:me.hand.indexOf("PIN")};
  }
  if(S.exposed==="a"&&S.top==="a"){
    if(has("SPLA"))return {type:"play",k:"SPLA",idx:me.hand.indexOf("SPLA")};
    const nf=biggestNF(s); if(nf)return {type:"play",k:nf,idx:me.hand.indexOf(nf)};
  }
  if(has("WIZ")){
    const last3=opp.hist.slice(-3).reduce((a,b)=>a+b,0);
    if(last3>=6)return {type:"play",k:"WIZ",idx:me.hand.indexOf("WIZ")};
  }
  if(has("CMBK")&&lead<=-5)return {type:"play",k:"CMBK",idx:me.hand.indexOf("CMBK")};
  if(has("RESIL")&&S.top==="p"&&S.firstTrans&&Math.random()<.7)return {type:"play",k:"RESIL",idx:me.hand.indexOf("RESIL")};
  if(S.top===null){
    if(has("FTB"))return {type:"play",k:"FTB",idx:me.hand.indexOf("FTB")};
    if(has("TD"))return {type:"play",k:"TD",idx:me.hand.indexOf("TD")};
    if(has("BEAST")&&lead<0&&Math.random()<.5)return {type:"play",k:"BEAST",as:"TD",idx:me.hand.indexOf("BEAST")};
  }
  if(S.top==="p"){ // AI on bottom
    if(has("REV")&&Math.random()<Math.min(.95,.65*P.agg))return {type:"play",k:"REV",idx:me.hand.indexOf("REV")};
    if(has("ESC"))return {type:"play",k:"ESC",idx:me.hand.indexOf("ESC")};
    if(has("REV"))return {type:"play",k:"REV",idx:me.hand.indexOf("REV")};
    if(has("BEAST")&&Math.random()<.4)return {type:"play",k:"BEAST",as:"ESC",idx:me.hand.indexOf("BEAST")};
  }
  if(has("STALL")&&S.deck.length&&Math.random()<.9*P.stall)return {type:"play",k:"STALL",idx:me.hand.indexOf("STALL")};
  if(me.draws>0&&S.deck.length)return {type:"draw"};
  if(has("STALL")&&S.deck.length)return {type:"play",k:"STALL",idx:me.hand.indexOf("STALL")};
  // any legal leftover?
  for(let i=0;i<me.hand.length;i++){const k=me.hand[i];if(legality(s,k,"action").ok&&k!=="BEAST")return {type:"play",k,idx:i};}
  if(has("BEAST")){const ms=beastModes(s,"action");if(ms.length)return {type:"play",k:"BEAST",as:ms[0],idx:me.hand.indexOf("BEAST")};}
  return {type:"pass"};
}
/* autopilot = simple random-legal brain driving the player seat (simulation) */
function autoPilotAction(side,mode){
  return genericAuto(side,mode);
}
function genericAuto(side,mode){
  const me=S[side];
  const legal=[];
  me.hand.forEach((k,i)=>{
    if(k==="BEAST"){const ms=beastModes(side,mode);if(ms.length&&legality(side,k,mode).ok)legal.push({type:"play",k,as:ms[0],idx:i,fromChain:mode==="chain"});}
    else if(legality(side,k,mode).ok)legal.push({type:"play",k,idx:i,fromChain:mode==="chain"});
  });
  if(legal.length&&Math.random()<.9)return legal[rnd(legal.length)];
  if(mode==="action"&&me.draws>0&&S.deck.length&&Math.random()<.7)return {type:"draw"};
  return {type:"pass"};
}
function autoPilotAnswer(side,vsKind,opts){
  if(!opts.length)return null;
  if(vsKind==="PIN"||vsKind==="MB"||vsKind==="SPLA"||vsKind==="FTB")return opts[0];
  return Math.random()<.8?opts[rnd(opts.length)]:null;
}

/* ---------- turn engine ---------- */
async function takeTurn(side){
  S.turn=side;
  const me=S[side];
  if(!me.isAI&&!AUTOPLAY){ VIEW=side; await passGate(side); }
  if(S.streak.owner!==side)chainReset(side);
  S.exposed=(S.exposed===side)?S.exposed:null; // exposure never survives to opponent's turn
  let mode="action", iter=0, played=false, lastRes=null;
  if(!me.isAI&&!AUTOPLAY)renderMat();
  while(!S.over&&iter++<20){
    let action;
    if(me.isAI){
      oppThink(S.a.ch.nm.toUpperCase()+" IS THINKING...");
      await sleep(700);
      action=aiAction(mode);
      oppThink("");
    }else{
      action=await waitPlayerAction(mode);
    }
    if(action.type==="pass"){
      if(mode==="bonus"){
        // skipped the free near-fall window — chain window may still be open
        const cm=me.hand.includes("MOM")||me.hand.includes("BEAST");
        const cc=me.hand.includes("CUTEM")&&S.lastLandedTD===side;
        if(cm||cc){mode="chain";continue;}
        break;
      }
      if(mode==="chain")break; // end turn
      if(!played){
        S.passStreak++;
        logMsg("<b>"+me.ch.nm+"</b> passes."+(S.passStreak>=2?" Neither can move — to the scorecards!":""));
        if(S.passStreak>=2){await endByScore();}
      }
      break;
    }
    if(action.type==="draw"){
      me.draws--; if(S.deck.length)me.hand.push(S.deck.pop());
      S.passStreak=0;
      logMsg("<b>"+me.ch.nm+"</b> draws a card ("+me.draws+" left).");
      if(!me.isAI&&!AUTOPLAY)renderHand(null,null);
      renderOpp();
      break; // drawing ends the turn
    }
    // confirm dramatic plays for the human
    if(!me.isAI&&!AUTOPLAY&&(action.k==="PIN"||action.k==="MB"||(action.k==="SPLA"))){
      const t=action.k==="MB"?"UNLEASH MAT BEAST?":"GO FOR THE PIN?";
      const st=action.k==="MB"?"Instant win — only a Beastin' wild can stop it.":(action.k==="SPLA"?"+4 back points AND a pin threat — only Beastin' saves them.":"Win instantly... or they block it and you've shown your hand.");
      const ok=await confirmDialog(t,st,action.k==="MB"?"UNLEASH IT":"GO FOR IT","NOT YET");
      if(!ok){renderHand(null,null);continue;}
    }
    S.passStreak=0; played=true;
    if(mode==="chain")action.fromChain=true;
    lastRes=await resolvePlay(side,action);
    if(S.over)return;
    if(lastRes.continueTurn){mode="action";continue;}
    if(lastRes.bonusNF&&(biggestNF(side)&&S[side].hand.includes(biggestNF(side))||S[side].hand.includes("SPLA"))){
      S.lastChainTD=lastRes.landedTD?side:null;
      mode="bonus";continue;
    }
    // chain window?
    S.lastChainTD=lastRes.landedTD?side:null;
    const canMom=me.hand.includes("MOM")||me.hand.includes("BEAST");
    const canCut=me.hand.includes("CUTEM")&&S.lastLandedTD===side;
    if(canMom||canCut){mode="chain";continue;}
    break;
  }
  if(me.justStalled)me.justStalled=false; // stall restriction only bites within the same turn streak
}
async function matchLoop(){
  renderAll();
  while(!S.over){
    await takeTurn(S.turn);
    if(S.over)break;
    // turn passes
    S.exposed=null;
    const next=other(S.turn);
    if(next===S.starter)S.round++;
    if(S.round>25){await endByScore();break;}
    S.turn=next;
    renderScores();
    // dead game check: both empty handed and no draws
    const dead=["p","a"].every(x=>S[x].hand.length===0&&(S[x].draws===0||S.deck.length===0));
    if(dead){await endByScore();break;}
    if(!S.over&&S[S.turn].isAI===false&&!AUTOPLAY)renderHand(null,null);
  }
}

async function tenthCardDraw(){
  if(TUTOR){
    S.starter="p"; S.starterLoser="a";
    if(S.deck.length)S.p.hand.push(S.deck.pop());
    if(S.deck.length)S.a.hand.push(S.deck.pop());
    if(!AUTOPLAY){
      const o=el("div","overlay");
      o.appendChild(el("h2","","FIRST TIME ON THE MAT"));
      o.appendChild(el("div","sub","Coach is in your corner. Follow the glowing card — you'll know the chain in 60 seconds."));
      $("ovl").appendChild(o);
      await sleep(1900); o.remove();
    }
    return;
  }
  let guard=0;
  while(guard++<40){
    if(S.deck.length<2){S.starter="p";S.starterLoser="a";return;}
    const cp=S.deck.pop(), ca=S.deck.pop();
    const bad=k=>C[k].kind==="spec"||k==="PIN"||k==="MB";
    if(bad(cp)||bad(ca)){
      // invalid draws return; redraw both
      S.deck.push(cp,ca);shuffle(S.deck);continue;
    }
    const vp=drawVal(cp),va=drawVal(ca);
    if(vp===va){S.deck.push(cp,ca);shuffle(S.deck);continue;}
    S.p.hand.push(cp);S.a.hand.push(ca);
    S.starter=vp>va?"p":"a"; S.starterLoser=other(S.starter);
    if(!AUTOPLAY){
      const o=el("div","overlay");
      o.appendChild(el("h2","","10TH CARD DRAW"));
      o.appendChild(el("div","sub","High card takes the first move. Beastin' counts 3."));
      const row=el("div","sheetcards");
      const w1=el("div"),w2=el("div");
      w1.appendChild(cardEl(cp,true));w1.appendChild(el("div","sub","YOU — value "+vp));
      w2.appendChild(cardEl(ca,true));w2.appendChild(el("div","sub",S.a.ch.nm.toUpperCase()+" — value "+va));
      row.appendChild(w1);row.appendChild(w2);
      o.appendChild(row);
      o.appendChild(el("div","sub","<b style='color:var(--gold);font-size:14px'>"+(S.starter==="p"?"YOU START":S.a.ch.nm.toUpperCase()+" STARTS")+"</b>"));
      $("ovl").appendChild(o);
      await sleep(2100);o.remove();
    }
    return;
  }
  S.starter="p";S.starterLoser="a";
}

}

/* ---------- simulation hook (testing) ---------- */
window.__simulate=async function(n){
  n=n||50;
  const saveFast=UI_FAST,saveAuto=AUTOPLAY;
  UI_FAST=true;AUTOPLAY=true;
  const tally={matches:0,pPin:0,aPin:0,tech:0,major:0,dec:0,ot:0,errors:[],avgRounds:0,how:{}};
  for(let i=0;i<n;i++){
    try{
      const a=CHARS[1+rnd(4)];
      newMatch(CHARS[0],a);
      await tenthCardDraw();
      S.turn=S.starter;
      await matchLoop();
      if(!S.over){tally.errors.push("match "+i+" never ended");continue;}
      tally.matches++;tally.avgRounds+=S.round;
      const h=S.result.how;
      tally.how[h]=(tally.how[h]||0)+1;
      if(h.includes("PIN")||h.includes("MAT BEAST")||h.includes("PINNED")){if(S.result.winner==="p")tally.pPin++;else tally.aPin++;}
      else if(h==="TECH FALL")tally.tech++;
      else if(h==="MAJOR DECISION")tally.major++;
      else if(h.includes("OT"))tally.ot++;
      else tally.dec++;
    }catch(e){tally.errors.push("match "+i+": "+(e.stack||e.message||e));if(tally.errors.length>4)break;}
  }
  tally.avgRounds=(tally.avgRounds/Math.max(1,tally.matches)).toFixed(1);
  UI_FAST=saveFast;AUTOPLAY=saveAuto;
  return tally;
};
